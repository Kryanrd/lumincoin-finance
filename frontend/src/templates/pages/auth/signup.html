<div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="mb-5">
        <a href="javascript:void(0)">
            <img src="../images/logo.png" alt="Логотип">
        </a>
    </div>
    <div class="form-container">
        <p class="fw-bold text-primary-emphasis fs-1 text-center">Создайте аккаунт</p>
        <div id="common-error" class="error invalid-feedback text-center mb-3">Не удалось зарегистрировать
            пользователя. Обратитесь в поддержку.</div>
        <form>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" class="form-control px-3" placeholder="Имя" id="name">
                <span id="name-error" class="error invalid-feedback">Заполните имя</span>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" class="form-control px-3" placeholder="Фамилия" id="last-name">
                <span id="last-name-error" class="error invalid-feedback">Заполните фамилию</span>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-envelope-open"></i>
                </span>
                <input type="email" class="form-control px-3" placeholder="Электронная почта" id="email">
                <span id="email-error" class="error invalid-feedback">Введите корректный E-mail</span>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control px-3" placeholder="Пароль" id="password">
                <span id="password-error" class="error invalid-feedback">Заполните пароль</span>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control px-3" placeholder="Подтверждение пароля"
                    id="password-repeat">
                <span id="password-repeat-error" class="error invalid-feedback">Пароль и повторение пароля должны
                    совпадать</span>
            </div>
            <div class="row mb-2">
                <div class="col-12">
                    <button type="button" class="btn btn-primary w-100" id="process-button">Зарегистрироваться</button>
                </div>
            </div>
            <p class="text-black fs-6 text-center">Уже есть аккаунт?<a href="/login" class="link-primary ms-2">Войдите в
                    систему</a></p>
        </form>
    </div>
</div>
