<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание категории доходов</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <div class="d-flex">
        <div class="d-flex flex-column flex-shrink-0 min-vh-100 py-5 bg-light" style="width: 219px;">
            <a href="/" class="d-flex justify-content-center w-100 mx-auto mb-5">
                <img src="../images/logo-mini.png" alt="Логотип">
            </a>
            <ul class="nav nav-pills flex-column mb-auto px-3 pt-5 border-top border-secondary-subtle">
                <li class="nav-item">
                    <a href="/frontend/templates/index.html" class="nav-link text-primary-emphasis py-2 pe-0"
                        aria-current="page">
                        <i class="bi bi-house"></i>
                        Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/frontend/templates/income-expenses.html" class="nav-link text-primary-emphasis py-2 pe-0">
                        <i class="bi bi-cash-coin"></i>
                        Доходы & Расходы
                    </a>
                </li>
                <li class="nav-item w-100">
                    <div class="accordion-item-custom" id="categoriesGroup">
                        <button class="btn btn-toggle d-flex align-items-center rounded w-100 border-0 py-2 ps-3"
                            data-bs-toggle="collapse" data-bs-target="#home-collapse" aria-expanded="true">
                            <span>Категории</span>
                            <i class="bi bi-chevron-right ms-auto"></i>
                        </button>
                        <div class="collapse show" id="home-collapse">
                            <ul class="list-unstyled mb-0">
                                <li><a href="/frontend/templates/incomes.html"
                                        class="submenu-link d-block py-1 active">Доходы</a></li>
                                <li><a href="/frontend/templates/expenses.html"
                                        class="submenu-link d-block py-1">Расходы</a></li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
            <p class="text-primary-emphasis ps-3">Баланс:<span class="ms-2 text-primary">500$</span></p>
            <div class="d-flex align-items-center gap-3 pt-4 ps-4 border-top border-secondary-subtle">
                <div>
                    <img src="../images/icon.png" alt="Иконка">
                </div>
                <div class="text-primary-emphasis fs-6">
                    Roman Chernov
                </div>
            </div>
        </div>
        <div class="main-container">
            <h1 class="text-primary-emphasis mt-100px lh-1 mb-5">Создание категории доходов</h1>
            <div class="custom-form d-flex flex-column gap-3">
                <input type="text" placeholder="Название..." class="form-control ps-3 text-secondary-emphasis">
                <div class="d-flex gap-2">
                    <button class="btn btn-success px-3 py-2 w-25">Создать</button>
                    <button class="btn btn-danger px-3 py-2 w-25">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../scripts/main.js"></script>
</body>




</html>
