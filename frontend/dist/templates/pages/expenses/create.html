<h1 class="text-primary-emphasis mt-100px lh-1 mb-5">Создание категории расходов</h1>
<div class="custom-form d-flex flex-column gap-3">
    <input type="text" class="form-control ps-3 text-secondary-emphasis" id="expenseInput">
    <span id="expenseInput-error" class="error invalid-feedback">Заполните поле</span>
    <div class="d-flex gap-2">
        <button class="btn btn-success px-3 py-2 w-25" id="createButton">Создать</button>
        <button class="btn btn-danger px-3 py-2 w-25" id="cancelButton">Отмена</button>
    </div>
</div>
