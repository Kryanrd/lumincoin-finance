<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="mb-5">
            <a href="javascript:void(0)">
                <img src="../images/logo.png" alt="Логотип">
            </a>
        </div>
        <div class="form-container">
            <p class="fw-bold text-primary-emphasis fs-1 text-center">Вход</p>
            <form>
                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-envelope-open"></i>
                    </span>
                    <input type="email" class="form-control px-3" placeholder="Электронная почта">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control px-3" placeholder="Пароль">
                </div>
                <div class="row mb-4">
                    <div class="col-12 d-flex align-items-center">
                        <input type="checkbox" id="remember" class="form-check-input me-2">
                        <label for="remember" class="fs-6 text-black">
                            Запомнить меня
                        </label>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-12">
                        <button type="button" class="btn btn-primary w-100">Войти</button>
                    </div>
                </div>
                <p class="text-black fs-6">Ещё нет аккаунта?<a href="/frontend/templates/signup.html" class="link-primary ms-2">Пройдите регистрацию</a></p>
            </form>
        </div>
    </div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>

</html>
