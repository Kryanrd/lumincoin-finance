<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <div class="d-flex">
        <div class="d-flex flex-column flex-shrink-0 min-vh-100 py-5 bg-light" style="width: 219px;">
            <a href="/" class="d-flex justify-content-center w-100 mx-auto mb-5">
                <img src="../images/logo-mini.png" alt="Логотип">
            </a>
            <ul class="nav nav-pills flex-column mb-auto px-3 pt-5 border-top border-secondary-subtle">
                <li class="nav-item">
                    <a href="/frontend/templates/index.html" class="nav-link active py-2 pe-0"
                        aria-current="page">
                        <i class="bi bi-house"></i>
                        Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/frontend/templates/income-expenses.html" class="nav-link text-primary-emphasis py-2 pe-0">
                        <i class="bi bi-cash-coin"></i>
                        Доходы & Расходы
                    </a>
                </li>
                <li class="nav-item w-100">
                    <div class="accordion-item-custom" id="categoriesGroup">
                        <button class="btn btn-toggle d-flex align-items-center rounded w-100 border-0 py-2 ps-3"
                            data-bs-toggle="collapse" data-bs-target="#home-collapse" aria-expanded="true">
                            <span>Категории</span>
                            <i class="bi bi-chevron-right ms-auto"></i>
                        </button>
                        <div class="collapse show" id="home-collapse">
                            <ul class="list-unstyled mb-0">
                                <li><a href="/frontend/templates/incomes.html" class="submenu-link d-block py-1">Доходы</a></li>
                                <li><a href="/frontend/templates/expenses.html" class="submenu-link d-block py-1">Расходы</a></li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
            <p class="text-primary-emphasis ps-3">Баланс:<span class="ms-2 text-primary">500$</span></p>
            <div class="d-flex align-items-center gap-3 pt-4 ps-4 border-top border-secondary-subtle">
                <div>
                    <img src="../images/icon.png" alt="Иконка">
                </div>
                <div class="text-primary-emphasis fs-6">
                    Roman Chernov
                </div>
            </div>
        </div>
        <div class="main-container">
            <h1 class="text-primary-emphasis mt-100px lh-1 mb-5">Главная</h1>
            <div class="d-flex gap-4 align-items-center mb-5">
                <button class="btn btn-secondary btn-filter px-3 py-2">Сегодня</button>
                <button class="btn btn-outline-secondary btn-filter px-3 py-2">Неделя</button>
                <button class="btn btn-outline-secondary btn-filter px-3 py-2">Месяц</button>
                <button class="btn btn-outline-secondary btn-filter px-3 py-2">Год</button>
                <button class="btn btn-outline-secondary btn-filter px-3 py-2">Все</button>
                <button class="btn btn-outline-secondary btn-filter px-3 py-2">Интервал</button>
                <p class="text-black mb-0">с</p>
                <p class="d-flex justify-content-center align-items-center mb-0">
                    <a href="#" class="link-secondary link-offset-2">Дата</a>
                </p>
                <p class="text-black mb-0">по</p>
                <p class="d-flex justify-content-center align-items-center mb-0">
                    <a href="#" class="link-secondary link-offset-2">Дата</a>
                </p>
            </div>

            <div class="d-flex align-items-center">
                <div class="custom-pie">
                    <h3 class="text-primary-emphasis text-center mb-4">Доходы</h3>
                    <canvas id="incomeChart" width="437" height="437"></canvas>
                </div>
                <div class="bg-body-secondary custom-line"></div>
                <div class="custom-pie">
                    <h3 class="text-primary-emphasis text-center mb-4">Расходы</h3>
                    <canvas id="expenseChart" width="437" height="437"></canvas>
                </div>
            </div>
        </div>
    </div>



    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="../scripts/main-chart.js"></script>
    <script src="../scripts/main.js"></script>
</body>




</html>
